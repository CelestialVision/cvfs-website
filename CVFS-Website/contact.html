<main>
    <section class="contact-wrapper fade-in">
        <h1 class="contact-title">Get in Touch</h1>
        <p class="contact-subtitle">Have questions, need assistance, or want to request a service? We're here to help.</p>

        <form class="contact-form" action="#" method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone">

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit" class="contact-submit">Send Message</button>
        </form>
    

<section class="contact-info fade-in">
    <div class="contact-item">
        <span class="contact-icon">📞</span>
        <p>(555) 123‑4567</p>
    </div>

    <div class="contact-item">
        <span class="contact-icon">📧</span>
        <p>support@cvfieldservices.com</p>
    </div>

    <div class="contact-item">
        <span class="contact-icon">📍</span>
        <p>Serving All of Texas</p>
    </div>
</section>

</main>
